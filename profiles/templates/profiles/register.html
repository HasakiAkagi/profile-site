<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>プロフィール登録</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>

<body>
  <div class="page-center">
    <div class="form-card">
      <h1>プロフィール登録</h1>
      <div class="button-area">
        <a href="{% url 'profiles:profile_list' %}" class="back-btn">プロフィール一覧に戻る</a>
      </div>
      <form method="post" action="{% url 'profiles:profile_register' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label for="photo">写真をアップロードしてください</label>
          <input type="file" id="photo" name="photo"
            accept="image/jpeg,image/png,image/gif,image/webp,.jpg,.jpeg,.png,.gif,.webp">
        </div>

        <div class="form-group">
          <label for="name">氏名</label>
          <input type="text" id="name" name="name" maxlength="100" placeholder="苗字と名前の間に半角スペースを入れてください" required>
        </div>

        <div class="form-group">
          <label for="mbti">MBTI</label>
          <select id="mbti" name="mbti" required>
            <option value="">選択してください</option>
            {% for choice in mbti_choices %}
            <option value="{{ choice }}">{{ choice }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="hobby">趣味</label>
          <input type="text" id="hobby" name="hobby" maxlength="100" placeholder="100文字以下で入力してください" required>
        </div>

        <div class="form-group">
          <label for="skill">特技</label>
          <input type="text" id="skill" name="skill" maxlength="100" placeholder="100文字以下で入力してください" required>
        </div>

        <div class="form-group">
          <label for="department">所属部署</label>
          <select id="department" name="department" required>
            <option value="">選択してください</option>
            {% for choice in department_choices %}
            <option value="{{ choice }}">{{ choice }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="relationship">関係値</label>
          <select id="relationship" name="relationship" required>
            <option value="">選択してください</option>
            {% for choice in relationship_choices %}
            <option value="{{ choice }}">{{ choice }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="talk">最近話した内容</label>
          <textarea id="talk" name="talk" rows="4" placeholder="自由に入力してください" required></textarea>
        </div>

        <button type="submit" class="submit-btn">登録</button>
      </form>
    </div>
  </div>
</body>

</html>
