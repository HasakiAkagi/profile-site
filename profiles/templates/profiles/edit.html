<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロフィール編集</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body class="login-page">
  <div class="page-center">
    <div class="form-card">
      <h1>プロフィール編集</h1>

      <div class="button-area">
        <a href="{% url 'profiles:profile_list' %}" class="back-btn">プロフィール一覧に戻る</a>
      </div>

      {% if profile.photo %}
      <div class="current-photo">
        <label>登録済みの写真</label><br>
        <img src="{{ profile.photo.url }}" alt="現在の写真" class="current-photo-img">
      </div>
      {% endif %}

      <form method="post" action="{% url 'profiles:profile_edit' profile.id %}" enctype="multipart/form-data"
        onsubmit="return validateProfileEditForm();">
        {% csrf_token %}

        <div class="form-group">
          <label for="photo">写真をアップロードしてください</label>
          <input type="file" id="photo" name="photo"
            accept="image/jpeg,image/png,image/gif,image/webp,.jpg,.jpeg,.png,.gif,.webp">
        </div>

        <div class="form-group">
          <label for="name">氏名</label>
          <input type="text" id="name" name="name" maxlength="100"
            placeholder="苗字と名前の間に半角スペースを入れてください"
            value="{{ profile.name }}" required>
        </div>

        <div class="form-group">
          <label for="mbti">MBTI</label>
          <select id="mbti" name="mbti" required>
            <option value="">選択してください</option>
            {% for choice in mbti_choices %}
              {% if profile.mbti == choice %}
              <option value="{{ choice }}" selected>{{ choice }}</option>
              {% else %}
              <option value="{{ choice }}">{{ choice }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="hobby">趣味</label>
          <input type="text" id="hobby" name="hobby" maxlength="100"
            placeholder="100文字以下で入力してください"
            value="{{ profile.hobby }}" required>
        </div>

        <div class="form-group">
          <label for="skill">特技</label>
          <input type="text" id="skill" name="skill" maxlength="100"
            placeholder="100文字以下で入力してください"
            value="{{ profile.skill }}" required>
        </div>

        <div class="form-group">
          <label for="department">所属部署</label>
          <select id="department" name="department" required>
            <option value="">選択してください</option>
            {% for choice in department_choices %}
              {% if profile.department == choice %}
              <option value="{{ choice }}" selected>{{ choice }}</option>
              {% else %}
              <option value="{{ choice }}">{{ choice }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="relationship">関係値</label>
          <select id="relationship" name="relationship" required>
            <option value="">選択してください</option>
            {% for choice in relationship_choices %}
              {% if profile.relationship == choice %}
              <option value="{{ choice }}" selected>{{ choice }}</option>
              {% else %}
              <option value="{{ choice }}">{{ choice }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="talk">最近話した内容</label>
          <textarea id="talk" name="talk" rows="4" placeholder="自由に入力してください" required>{{ profile.talk }}</textarea>
        </div>

        <button type="submit" class="submit-btn">登録</button>
      </form>
    </div>
  </div>

  <script>
    function validateProfileEditForm() {
      const name = document.getElementById("name").value.trim();
      const mbti = document.getElementById("mbti").value.trim();
      const department = document.getElementById("department").value.trim();
      const relationship = document.getElementById("relationship").value.trim();
      const hobby = document.getElementById("hobby").value.trim();
      const skill = document.getElementById("skill").value.trim();
      const talk = document.getElementById("talk").value.trim();

      if (
        name === "" ||
        mbti === "" ||
        department === "" ||
        relationship === "" ||
        hobby === "" ||
        skill === "" ||
        talk === ""
      ) {
        alert("未入力の項目があります。すべて入力してください。");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
