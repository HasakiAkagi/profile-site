{% extends "base.html" %}
{% block content %}
<div class="login-box">
    <h2>ログイン画面</h2>
    <p class="login-description">登録済みのユーザIDとパスワードを入力してください</p>
    {% if error_message %}
    <p class="login-error">{{ error_message }}</p>
    {% endif %}
    <form action="/login" method="post">
        <label for="user_id">ユーザID</label>
        <input type="text" id="user_id" name="user_id" placeholder="ユーザIDを入力" required>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
        <button type="submit">ログイン</button>
    </form>
    <a href="/signup" class="signup-link">新規登録はこちら</a>
</div>
{% endblock %}
