<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チーム一覧</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'team/css/team_list.css' %}">
</head>
<body class="team-list-page">
  <div class="page-center">
    <div class="team-list-card">
      <h1>チーム一覧</h1>

      <div class="button-area">
        <a href="{% url 'menu' %}" class="back-btn">メニューに戻る</a>
      </div>

      <form method="get" class="search-form">
        <input type="text" name="search" value="{{ search }}" placeholder="チーム名で検索">
        <button type="submit" class="search-btn">検索</button>
      </form>

      <div class="button-area button-area-center">
        <a href="{% url 'team:team_create' %}" class="create-btn">チーム作成</a>
      </div>

      <div class="team-list">
        {% for team in teams %}
        <div class="team-card">
          <button type="button" class="team-name-btn" onclick="openTeamModal(this)" data-team-id="{{ team.id }}"
            data-team-name="{{ team.name|default_if_none:'' }}"
            data-leader-name="{{ team.leader_name|default_if_none:'' }}"
            data-memo="{{ team.memo|default_if_none:'' }}"
            data-self-included="{% if team.self_included %}はい{% else %}いいえ{% endif %}"
            data-members="{% for member in team.members.all %}{{ member.name }}（{{ member.mbti }} / {{ member.department }}）{% if not forloop.last %}||{% endif %}{% endfor %}">
            {{ team.name }}
          </button>
        </div>
        {% empty %}
        <p class="message">チームが登録されていません</p>
        {% endfor %}
      </div>
    </div>
  </div>

  <!-- 共通モーダル -->
  <div id="team-modal" class="modal hidden-modal">
    <div class="modal-content">
      <h3 id="modal-team-name" class="team-name"></h3>

      <p class="team-meta">
        <strong>管理者：</strong>
        <span id="modal-leader-name"></span>
      </p>

      <p class="team-meta">
        <strong>メモ：</strong>
        <span id="modal-memo"></span>
      </p>

      <p class="team-meta">
        <strong>自分を含める：</strong>
        <span id="modal-self-included"></span>
      </p>

      <p class="team-meta"><strong>メンバー：</strong></p>
      <ul id="modal-members" class="team-members"></ul>

      <div class="button-area modal-buttons">
        <a id="modal-edit-btn" href="#" class="edit-btn">編集</a>

        <form id="modal-delete-form"
              method="post"
              action="#"
              onsubmit="return confirm('本当に削除してもよろしいですか？');"
              class="inline-form">
          {% csrf_token %}
          <button type="submit" class="delete-btn">削除</button>
        </form>

        <button type="button" class="modal-close-btn" onclick="closeTeamModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    function openTeamModal(button) {
      const modal = document.getElementById('team-modal');
      const teamId = button.dataset.teamId || '';
      const teamName = button.dataset.teamName || '';
      const leaderName = button.dataset.leaderName || '未設定';
      const memo = button.dataset.memo || '';
      const selfIncluded = button.dataset.selfIncluded || 'いいえ';
      const membersText = button.dataset.members || '';

      document.getElementById('modal-team-name').textContent = teamName;
      document.getElementById('modal-leader-name').textContent = leaderName;
      document.getElementById('modal-memo').textContent = memo;
      document.getElementById('modal-self-included').textContent = selfIncluded;

      const membersUl = document.getElementById('modal-members');
      membersUl.innerHTML = '';

      if (membersText) {
        membersText.split('||').forEach(function (member) {
          const li = document.createElement('li');
          li.textContent = member;
          membersUl.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = 'メンバーなし';
        membersUl.appendChild(li);
      }

      document.getElementById('modal-edit-btn').href = `/team/edit/${teamId}/`;
      document.getElementById('modal-delete-form').action = `/team/delete/${teamId}/`;

      modal.style.display = 'flex';
    }

    function closeTeamModal() {
      document.getElementById('team-modal').style.display = 'none';
    }

    window.addEventListener('click', function (event) {
      const modal = document.getElementById('team-modal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
