<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>チーム作成</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'team/css/team_create.css' %}">
</head>

<body>
  <div class="page-center">
    <div class="form-card">
      <h1>チーム作成</h1>
      <div class="button-area">
        <a href="{% url 'team:team_list' %}" class="back-btn">チーム一覧に戻る</a>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="name">チーム名</label>
          <input type="text" id="name" name="name" maxlength="100" placeholder="100文字以下で入力してください" required>
        </div>

        <div class="form-group">
          <label for="leader_name">管理者</label>
          <input type="text" id="leader_name" name="leader_name" maxlength="100" placeholder="100文字以下で入力してください">
        </div>

        <div class="form-group">
          <label for="memo">メモ</label>
          <textarea id="memo" name="memo" placeholder="自由に入力してください"></textarea>
        </div>

        <div class="form-group">
          <label>メンバー選択</label>
          <div class="member-box">
            <div class="member-item self-item">
              <label>
                <input type="checkbox" name="include-self-member" value="1">
                自分を含める
              </label>
            </div>

            {% for profile in profiles %}
            <div class="member-item">
              <label>
                <input type="checkbox" name="members" value="{{ profile.id }}">
                {{ profile.name }}（{{ profile.mbti }} / {{ profile.department }}）
              </label>
            </div>
            {% empty %}
            <p>登録済みプロフィールがありません</p>
            {% endfor %}
          </div>
        </div>

        <div class="btn-area">
          <button type="submit" id="create-btn">作成</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
